<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>BookedIn – Your AI Reading Companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf1e0;--card:#fffaf1;--ink:#3a2316;--mute:#8d7260;--acc:#e8873a;--acc2:#f8dcbc;--sh:0 6px 24px rgba(95,55,20,.11);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d150e;--card:#2a1e15;--ink:#f4e7d3;--mute:#b99d84;--acc2:#4b3422;--sh:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d150e;--card:#2a1e15;--ink:#f4e7d3;--mute:#b99d84;--acc2:#4b3422;--sh:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,serif;display:grid;grid-template-columns:220px 1fr;min-height:100vh}
h1,h2,h3{font-weight:600;margin:.2em 0}h1{font-size:34px}button,input,select,textarea,aside,.s{font-family:system-ui,-apple-system,sans-serif}
aside{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--acc2)}
aside b{font:600 24px Georgia,serif;padding:0 10px 18px}aside b i{color:var(--acc)}
aside button{background:none;color:var(--ink);text-align:left;border-radius:14px;padding:11px 14px;font-size:15px}aside button.on{background:var(--acc2);color:var(--acc);font-weight:600}
button{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;font-size:14px;transition:.2s}button:hover{transform:translateY(-1px)}
button.g{background:var(--acc2);color:var(--ink)}button.on{background:var(--ink);color:var(--bg)}
main{padding:28px 32px 120px;max-width:1040px;width:100%}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:20px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero{background:linear-gradient(120deg,var(--acc2),var(--card));border-radius:26px;padding:30px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"”";position:absolute;right:24px;top:-30px;font-size:200px;color:var(--acc);opacity:.15}
input,select,textarea{background:var(--card);color:var(--ink);border:1px solid var(--acc2);border-radius:14px;padding:10px 12px;width:100%;font-size:15px}
.cov{width:72px;height:104px;flex:none;border-radius:6px 12px 12px 6px;padding:8px 6px 8px 12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font:600 12px/1.15 Georgia,serif;box-shadow:var(--sh),inset 5px 0 0 rgba(0,0,0,.18);background-image:radial-gradient(circle at 80% 20%,rgba(255,255,255,.28),transparent 45%)}
.cov small{font:400 9px system-ui;opacity:.85}.cov.l{width:110px;height:160px;font-size:16px}
.bar{height:8px;border-radius:9px;background:var(--acc2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.mute{color:var(--mute);font-size:14px}.stat{font-size:34px;color:var(--acc)}.tag{background:var(--acc2);border-radius:99px;padding:3px 12px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:var(--card);color:var(--ink);box-shadow:var(--sh);border:2px solid transparent;padding:10px 16px}.chip.on{border-color:var(--acc);background:var(--acc2);color:var(--ink)}
.days{display:flex;justify-content:space-between}.days div{text-align:center;font-size:12px}.days span{display:block;font-size:22px;filter:grayscale(1);opacity:.35}.days .h span{filter:none;opacity:1}
#stage{border-radius:26px;padding:6px;transition:.4s}[data-rt=paper]{--pb:#fffaf0;--pi:#3a2316}[data-rt=sepia]{--pb:#f0deb8;--pi:#4a3320}[data-rt=night]{--pb:#17120d;--pi:#d9c9b0}
#rd{background:var(--pb);color:var(--pi);font-size:var(--fs,19px);line-height:1.9;padding:44px clamp(20px,7vw,70px);border-radius:22px;box-shadow:var(--sh);animation:turn .5s}
@keyframes turn{from{opacity:0;transform:translateX(24px) rotateY(-6deg)}}
#rd h2{text-align:center;font-style:italic}#rd .ch{text-align:center;letter-spacing:.3em;font:12px system-ui;color:var(--acc)}
#rd p:first-of-type:first-letter{font-size:3.6em;float:left;line-height:.8;padding:6px 8px 0 0;color:var(--acc)}
#rd span.now{background:rgba(232,135,58,.3);border-radius:4px}mark{background:#f8c978;color:#3a2316;border-radius:3px}
#dock{position:fixed;left:220px;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.wave{display:flex;align-items:center;gap:2px;height:44px;cursor:pointer}.wave i{flex:1;background:var(--acc2);border-radius:3px;transition:background .2s}.wave i.p{background:var(--acc)}
.vin{width:90px;height:90px;border-radius:50%;background:repeating-radial-gradient(#222 0 2px,#333 2px 4px);display:grid;place-items:center;animation:sp 6s linear infinite;box-shadow:var(--sh)}.vin i{width:30px;height:30px;border-radius:50%;background:var(--acc)}@keyframes sp{to{transform:rotate(360deg)}}
.cats{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px}.cats button{background:var(--card);color:var(--ink);box-shadow:var(--sh);border-radius:20px;min-width:92px;padding:12px 6px;font-size:12px}.cats button span{display:block;font-size:28px}
.bk{position:relative;display:inline-block;margin-bottom:12px}.bk:after{content:"";position:absolute;right:14px;bottom:-10px;width:14px;height:32px;background:#f0a23b;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.scene{border-radius:30px;overflow:hidden;box-shadow:var(--sh);background:var(--card)}.scene .art{transition:.6s}.scene.pl .art{animation:fl 7s ease-in-out infinite}@keyframes fl{50%{transform:scale(1.06) translateY(-4px)}}
.shelf{display:flex;align-items:flex-end;gap:3px;border-bottom:8px solid #b98a52;padding:0 6px;height:62px;margin-bottom:10px}.shelf i{flex:1;max-width:22px;border-radius:3px 3px 0 0;border:2px solid var(--acc2)}
.bub{padding:10px 16px;border-radius:18px;max-width:82%}.tile{flex:1;text-align:center;background:var(--acc2);border-radius:6px 14px 14px 6px;border-left:8px solid var(--acc);padding:12px 4px;font-size:13px}.tile b{display:block;font-size:22px}
@media(max-width:760px){body{grid-template-columns:1fr}aside{position:fixed;top:auto;bottom:0;height:auto;width:100%;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--card);border:0}aside b{display:none}aside button{padding:8px 6px;font-size:12px;text-align:center}main{padding:18px 14px 160px}#dock{left:0;bottom:56px}h1{font-size:26px}}
</style></head><body>
<aside><b>Booked<i>In</i></b><button data-p="home">🏠 Home</button><button data-p="disc">✨ Discover</button><button data-p="jour">📓 Journal</button><button data-p="read">📖 Reader</button><button data-p="audio">🎧 Audiobook</button><button data-p="chat">💬 Companion</button><button data-p="music">🎵 Soundtracks</button></aside>
<main id="m"></main><div id="dock" style="display:none"></div>
<script>
const COL=['linear-gradient(150deg,#d9772b,#8a3b12)','linear-gradient(150deg,#5a6e5f,#2b3d34)','linear-gradient(150deg,#a2597c,#5c2a47)','linear-gradient(150deg,#4a6a8a,#243a52)'];
const BOOKS=[
{id:'lk',t:'The Lantern Keeper',a:'Demo Author',g:'Cozy mystery',mood:'Cozy',d:'A coastal keeper finds a message hidden in the light.',pl:['Foggy Harbour Evenings','foggy harbour ambient','Soft piano and distant waves.'],ch:[
['The Last Light','Mara kept the lantern on Gull Point, as her mother had. Each night she climbed ninety steps and trimmed the wick. Tonight, the glass held a folded paper that no one had put there.'],
['The Paper','The note named a ship, the Verity, lost forty years ago. Mara knew the name from the harbour ledger. She did not know why a drowned ship would write to her.'],
['The Ledger','In the ledger, the Verity had a captain, Elias Roan, and a final entry written in her mother’s hand. Mara read it three times, and understood that her mother had known the ship would never return.'],
['The Tide','At dawn Mara rowed to the reef and found the Verity’s bell, still ringing under the swell. She brought it home, and the village finally remembered the names of the lost.']]},
{id:'sh',t:'Salt & Hours',a:'Demo Author',g:'Literary fiction',mood:'Contemplative',d:'A clockmaker learns to mend more than watches.',pl:['Workshop Hours','clockmaker instrumental','Ticking rhythms and warm strings.'],ch:[
['The Shop','Ines repaired clocks above the salt market. Customers brought her watches that had stopped at odd hours, and she never asked why.'],
['The Customer','A stranger left a pocket watch that ran backward. “Only fix the sorrow in it,” he said, and was gone before she could refuse.'],
['The Mending','Inside, Ines found a dried flower pressed between the gears. She cleaned the gears and left the flower, and the watch began to tick forward.']]}];
const BK=Object.fromEntries(BOOKS.map(b=>[b.id,b])),MOODS=['🧭 Adventurous','🌿 Contemplative','☕ Cozy','😄 Humorous','💌 Romantic','🌧 Melancholic','🔎 Curious','📻 Nostalgic','✨ Inspired','🌙 Hopeful'];
let S={lib:{},goal:12,fs:19,rt:'paper',cur:null,disc:[],wish:[],days:[],mood:'☕ Cozy'};
try{Object.assign(S,JSON.parse(localStorage.getItem('bookedin')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bookedin',JSON.stringify(S))}catch(e){}},$=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),today=()=>new Date().toISOString().slice(0,10);
const sents=t=>t.split(/(?<=[.!?”])\s+/),pct=id=>{const e=S.lib[id];return e?Math.round((e.ch+e.pos)/BK[id].ch.length*100):0};
const cov=(b,l,i=BOOKS.indexOf(b))=>`<div class="cov ${l?'l':''}" style="background:${COL[Math.abs(i)%4]}"><small>BOOKEDIN</small><span>${esc(b.t||b.title)}</span><small>${esc(b.a||b.author)}</small></div>`;
let page='home',A={on:false,rate:1,i:0},amb=null;
function add(id,sh){S.lib[id]=S.lib[id]||{ch:0,pos:0,quotes:[],notes:[],hl:[],started:today()};S.lib[id].shelf=sh;S.cur=S.cur||id;save();go(page)}
function go(p){page=p;stopA();$$('aside button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));$('#dock').style.display='none';({home,disc,jour,read,music,audio,chat})[p]();window.scrollTo(0,0)}
$$('aside [data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
const streak=()=>{let n=0,d=new Date();while(S.days.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n};
function home(){const ids=Object.keys(S.lib).filter(i=>S.lib[i]&&BK[i]),cr=ids.filter(i=>S.lib[i].shelf=='cur'),fin=ids.filter(i=>S.lib[i].shelf=='fin');const gp=Math.min(1,fin.length/S.goal),C=2*Math.PI*42;
const wk=['M','T','W','T','F','S','S'].map((l,i)=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+i);return `<div class="${S.days.includes(d.toISOString().slice(0,10))?'h':''}">${l}<span>🔥</span></div>`}).join('');
$('#m').innerHTML=`<div class="hero"><h1>Find your next book</h1><p class="mute">Search the library, or let the AI companion read your mood.</p><div class="row"><input id="q" placeholder="Search titles, authors, genres…" style="max-width:420px"><button onclick="go('disc')">Ask the AI ✨</button></div><div id="sr" style="margin-top:12px"></div></div>
<div class="cats">${[['📖','eBooks','read'],['🎧','Audiobooks','audio'],['✨','By mood','disc'],['💬','Companion','chat'],['📓','Journal','jour'],['🎵','Soundtracks','music']].map(c=>`<button onclick="go('${c[2]}')"><span>${c[0]}</span>${c[1]}</button>`).join('')}</div>
<h3>Popular on BookedIn</h3><div class="row" style="gap:26px;align-items:flex-start;margin-bottom:10px">${BOOKS.map(b=>`<div style="width:150px;text-align:center"><div class="bk">${cov(b,1)}</div><div><b>${b.t}</b></div><div class="mute">${b.a}</div><p style="margin:6px 0"><button data-l="${b.id}">▶ Listen</button> <button class="g" data-a="${b.id}">+</button></p></div>`).join('')}</div>
<div class="grid" style="grid-template-columns:2fr 1fr;align-items:start" id="gr"><div><div class="card"><h3>Continue reading</h3>${cr.map(i=>`<div class="row" style="margin:12px 0">${cov(BK[i])}<div style="flex:1;min-width:150px"><b>${BK[i].t}</b><div class="mute">Chapter ${S.lib[i].ch+1} of ${BK[i].ch.length} · ${pct(i)}%</div><div class="bar" style="margin:8px 0"><i style="width:${pct(i)}%"></i></div><button data-o="${i}">Resume</button> <button class="g" data-r="${i}">Remind me where I left off</button></div></div>`).join('')||'<p class="mute">Nothing in progress. Add a book below.</p>'}</div>
<div class="card"><h3>Recommended for you</h3><div class="grid">${BOOKS.filter(b=>!S.lib[b.id]).map(b=>`<div class="row">${cov(b)}<div><b>${b.t}</b><div class="mute">${b.g}</div><p style="margin:6px 0"><button class="g" data-a="${b.id}">+ Add to list</button></p></div></div>`).join('')||'<span class="mute">Everything is on your shelves.</span>'}</div></div></div>
<div><div class="card" style="text-align:center"><div class="mute">Yearly goal</div><svg width="110" height="110" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--acc2)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-gp)}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" fill="var(--ink)" font-size="22">${fin.length}/${S.goal}</text></svg>
<div class="mute">🏅 ${fin.length?'Achievement: first book finished':'Finish a book to earn your first badge'}</div></div>
<div class="card"><div class="row" style="justify-content:space-between"><div><div class="mute">Current streak</div><div class="stat">${streak()}</div></div><div><div class="mute">Quotes</div><div class="stat">${ids.reduce((n,i)=>n+S.lib[i].quotes.length,0)}</div></div></div><div class="days">${wk}</div></div>
<div class="card"><h3>My bookshelves</h3><div class="row" style="flex-wrap:nowrap"><div class="tile">Read<b>${fin.length}</b></div><div class="tile">Want<b>${ids.filter(i=>S.lib[i].shelf=='want').length}</b></div><div class="tile">Reading<b>${cr.length}</b></div></div></div><div class="card"><h3>2026 Book Shelf 🪴</h3>${[0,1].map(r=>`<div class="shelf">${Array.from({length:Math.min(8,Math.max(0,Math.min(16,S.goal)-r*8))},(_,k)=>{const n=r*8+k,f=n<fin.length;return `<i style="height:${34+(n*13)%26}px;${f?'background:'+COL[n%4].split(',')[1]+';border-color:transparent':''}"></i>`}).join('')}</div>`).join('')}<div class="mute">${fin.length} of ${S.goal} books shelved. Finish a book to fill a spine.</div></div></div></div>`;
$('#q').oninput=e=>{const v=e.target.value.toLowerCase();$('#sr').innerHTML=v?BOOKS.filter(b=>(b.t+b.a+b.g+b.d).toLowerCase().includes(v)).map(b=>`<button class="g" data-a="${b.id}">+ ${b.t}</button> `).join('')||'<span class="mute">No match in the demo library.</span>':'';wire()};wire()}
function wire(){$$('[data-l]').forEach(b=>b.onclick=()=>{add(b.dataset.l,S.lib[b.dataset.l]?S.lib[b.dataset.l].shelf:'cur');S.cur=b.dataset.l;go('audio')});$$('[data-o]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.o;save();go('read')});$$('[data-a]').forEach(b=>b.onclick=()=>add(b.dataset.a,'want'));$$('[data-r]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.r;go('read');setTimeout(()=>recap('short'),60)})}
let samp;async function ai(p){try{samp=samp||await claude.use('sample');return samp?(await samp(p,{cache:false})).text:null}catch(e){return null}}
function disc(){$('#m').innerHTML=`<h1>How are you feeling?</h1><p class="mute">Pick a mood, then tell the companion a little more.</p><div class="chips" id="ch">${MOODS.map(m=>`<button class="chip ${m==S.mood?'on':''}">${m}</button>`).join('')}</div>
<div class="card grid"><div><label class="mute">Favourite genres</label><input id="ge" placeholder="mystery, literary…"></div><div><label class="mute">Reading interests</label><input id="in" placeholder="the sea, craft…"></div><div><label class="mute">Length</label><select id="le"><option>Short</option><option>Medium</option><option>Long</option></select></div><div><label class="mute">Preferences</label><input id="pr" placeholder="slow, atmospheric"></div></div><button id="go">Get 3 recommendations ✨</button><div id="rec">${S.disc.length?rec(S.disc,S.disc.demo):''}</div>`;
$$('.chip').forEach(c=>c.onclick=()=>{S.mood=c.textContent;$$('.chip').forEach(x=>x.classList.toggle('on',x==c))});
$('#go').onclick=async()=>{const q={mood:S.mood,genres:$('#ge').value,interests:$('#in').value,length:$('#le').value,prefs:$('#pr').value};$('#rec').innerHTML='<p class="mute">Finding books…</p>';
const t=await ai(`Recommend exactly 3 real books for this reader: ${JSON.stringify(q)}. Reply ONLY with a JSON array of 3 objects {title,author,genre,description,why}. No markdown.`);let r=null,demo=false;try{r=JSON.parse(t.replace(/```json|```/g,'').trim())}catch(e){}
if(!Array.isArray(r)||r.length<3){demo=true;r=[...BOOKS].sort((a,b)=>(S.mood.includes(b.mood)-S.mood.includes(a.mood))).concat(BOOKS).slice(0,3).map(b=>({title:b.t,author:b.a,genre:b.g,description:b.d,why:`Fits your ${S.mood.slice(2).toLowerCase()} mood and ${q.length.toLowerCase()} length${q.interests?', and your interest in '+q.interests:''}.`,id:b.id}))}
S.disc=r.slice(0,3);S.disc.demo=demo;save();$('#rec').innerHTML=rec(S.disc,demo)}}
function rec(r,demo){setTimeout(()=>{$$('[data-a]').forEach(b=>b.onclick=()=>add(b.dataset.a,'want'));$$('[data-w]').forEach(b=>b.onclick=()=>{S.wish.push(S.disc[b.dataset.w]);save();b.textContent='Added ✓';b.disabled=true})});
return (demo?'<p><span class="tag">Demo mode: sample recommendations, AI unavailable</span></p>':'')+'<div class="grid">'+r.map((b,i)=>`<div class="card"><div class="row">${cov(b,0,i)}<div><b>${esc(b.title)}</b><div class="mute">${esc(b.author)}</div><span class="tag">${esc(b.genre)}</span></div></div><p>${esc(b.description)}</p><p class="mute"><b>Why it fits:</b> ${esc(b.why)}</p>${b.id?`<button data-a="${b.id}">Add to reading list</button>`:`<button data-w="${i}">Add to reading list</button>`}</div>`).join('')+'</div>'}
function jour(){const sh={cur:'Currently reading',want:'Want to read',fin:'Finished'};
$('#m').innerHTML=`<h1>My reading journal</h1><div class="card row"><span>Yearly goal</span><input type="number" id="gl" value="${S.goal}" style="width:90px"><span class="mute">books</span></div>`+Object.keys(sh).map(k=>`<h3>${sh[k]}</h3>`+(Object.keys(S.lib).filter(i=>S.lib[i]&&BK[i]&&S.lib[i].shelf==k).map(i=>{const e=S.lib[i],b=BK[i];return `<div class="card"><div class="row">${cov(b)}<div style="flex:1"><b>${b.t}</b><div class="mute">Started ${e.started}${e.done?' · Finished '+e.done:''} · Chapter ${e.ch+1}/${b.ch.length} · ${pct(i)}%</div><div class="bar" style="margin:6px 0"><i style="width:${pct(i)}%"></i></div><select data-s="${i}" style="width:auto">${Object.entries(sh).map(([v,l])=>`<option value="${v}" ${v==k?'selected':''}>${l}</option>`).join('')}</select></div><button data-o="${i}">Read</button></div>${e.quotes.map(q=>`<p style="border-left:3px solid var(--acc);padding-left:12px;font-style:italic">“${esc(q)}”</p>`).join('')}${e.notes.map(n=>`<p class="mute">✎ ${esc(n)}</p>`).join('')}</div>`}).join('')||'<p class="mute">Empty shelf.</p>')).join('')+`<h3>Wish list (AI picks)</h3>${S.wish.map(w=>`<p>${esc(w.title)} <span class="mute">· ${esc(w.author)}</span></p>`).join('')||'<p class="mute">None yet.</p>'}`;
$('#gl').onchange=e=>{S.goal=+e.target.value||1;save()};$$('[data-s]').forEach(s=>s.onchange=()=>{const e=S.lib[s.dataset.s];e.shelf=s.value;if(s.value=='fin')e.done=today();save();jour()});wire()}
function wv(id){const e=S.lib[id],n=60;return Array.from({length:n},(_,i)=>`<i class="${i/n<e.pos?'p':''}" style="height:${14+Math.abs(Math.sin(i*1.7)*26+Math.cos(i*.6)*8)}px"></i>`).join('')}
function ambience(k){try{if(amb){amb.c.close();amb=null}if(!k)return;const c=new AudioContext(),b=c.createBuffer(1,c.sampleRate*3,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=k=='rain'?w:(l+.02*w)/1.02;d[i]=k=='rain'?w:l*3.5}
const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;s.loop=true;f.type=k=='rain'?'bandpass':'lowpass';f.frequency.value=k=='rain'?1800:500;g.gain.value=k=='rain'?.07:.25;s.connect(f).connect(g).connect(c.destination);s.start();amb={c}}catch(e){}}
function read(){const id=S.cur;if(!id||!S.lib[id]){$('#m').innerHTML='<h1>Reader</h1><div class="card">Add a book to start reading.<p>'+BOOKS.map(b=>`<button class="g" data-a="${b.id}">+ ${b.t}</button> `).join('')+'</p></div>';wire();return}
const b=BK[id],e=S.lib[id];if(e.shelf=='want')e.shelf='cur';if(!S.days.includes(today())){S.days.push(today());save()}
$('#m').innerHTML=`<div class="row" style="margin-bottom:10px"><select id="bk" style="width:auto">${Object.keys(S.lib).filter(i=>S.lib[i]&&BK[i]).map(i=>`<option value="${i}" ${i==id?'selected':''}>${BK[i].t}</option>`).join('')}</select><button class="g" id="fm">A−</button><button class="g" id="fp">A+</button>${['paper','sepia','night'].map(t=>`<button class="g th" data-t="${t}">${t}</button>`).join('')}<button class="g" data-am="rain">🌧 Rain</button><button class="g" data-am="fire">🔥 Hearth</button><button class="g" data-am="">🔇 Off</button><button class="g" id="rc">🧠 Remind me where I left off</button><button class="g" onclick="go('audio')">🎧 Audio mode</button><span class="mute">☀ <input type="range" id="br" min="50" max="100" value="100" style="width:90px;padding:0"></span></div>
<div class="mute" id="pl"></div><div id="stage" data-rt="${S.rt}"><div id="rd" style="--fs:${S.fs}px"></div></div><div id="rcp"></div>
<div id="sel" class="card" style="display:none;position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9;padding:8px"><button id="hl">Highlight</button> <button class="g" id="sq">Save quote</button> <button class="g" id="sn">Add note</button></div>`;
$('#dock').style.display='';
const ch=()=>b.ch[e.ch],ss=()=>sents(ch()[1]);
function draw(){const r=$('#rd');r.style.animation='none';r.offsetHeight;r.style.animation='';r.innerHTML=`<div class="ch">CHAPTER ${e.ch+1}</div><h2>${ch()[0]}</h2><p>`+ss().map((s,i)=>`<span data-i="${i}">${(e.hl||[]).includes(e.ch+':'+s)?'<mark>'+esc(s)+'</mark>':esc(s)}</span>`).join(' ')+'</p>';$('#pl').textContent=`${b.t} · Chapter ${e.ch+1} of ${b.ch.length}`;dock()}
function dock(){const d=$('#dock');d.innerHTML=`<div class="s mute" style="display:flex;justify-content:space-between"><span>Ch ${e.ch+1}: ${ch()[0]}</span><span>${Math.round(e.pos*100)}% of chapter · ${pct(id)}% of book</span></div><div class="wave" id="wv">${wv(id)}</div><div class="row" style="justify-content:center"><button class="g" id="pv">⏮</button><button id="pp" style="padding:12px 26px;font-size:18px">${A.on?'⏸':'▶'}</button><button class="g" id="nx">⏭</button>${[.75,1,1.25,1.5,2].map(x=>`<button class="${x==A.rate?'on':'g'} sp" data-x="${x}">${x}x</button>`).join('')}</div>`;
$('#pv').onclick=()=>{if(e.ch>0){e.ch--;e.pos=0;sw()}};$('#nx').onclick=()=>{if(e.ch<b.ch.length-1){e.ch++;e.pos=0;sw()}else{e.shelf='fin';e.pos=1;e.done=today();save();$('#pl').textContent='🎉 Finished! Moved to your Finished shelf.'}};
$('#pp').onclick=()=>A.on?(stopA(),dock()):speak();$$('.sp').forEach(x=>x.onclick=()=>{A.rate=+x.dataset.x;dock();if(A.on)speak()});
$('#wv').onclick=x=>{const r=$('#wv').getBoundingClientRect();e.pos=Math.max(0,Math.min(.99,(x.clientX-r.left)/r.width));save();A.i=Math.floor(e.pos*ss().length);mark();if(A.on)speak();else dock()};save()}
function sw(){const w=A.on;stopA();draw();if(w)speak()}
function mark(){$$('#rd span').forEach((s,i)=>s.classList.toggle('now',A.on&&i==A.i))}
function speak(){speechSynthesis.cancel();const s=ss();A.i=Math.min(s.length-1,Math.floor(e.pos*s.length));A.on=true;dock();
(function nx(){if(!A.on)return;mark();if(A.i>=s.length){if(e.ch<b.ch.length-1){e.ch++;e.pos=0;draw();return speak()}A.on=false;dock();return}const u=new SpeechSynthesisUtterance(s[A.i]);u.rate=A.rate;u.onend=()=>{A.i++;e.pos=A.i/s.length;save();const w=$('#wv');if(w)w.innerHTML=wv(id);nx()};speechSynthesis.speak(u)})()}
$('#bk').onchange=x=>{S.cur=x.target.value;save();read()};$('#fp').onclick=()=>{S.fs=Math.min(30,S.fs+2);$('#rd').style.setProperty('--fs',S.fs+'px');save()};$('#fm').onclick=()=>{S.fs=Math.max(14,S.fs-2);$('#rd').style.setProperty('--fs',S.fs+'px');save()};
$$('.th').forEach(t=>t.onclick=()=>{S.rt=t.dataset.t;$('#stage').dataset.rt=S.rt;save()});$$('[data-am]').forEach(t=>t.onclick=()=>ambience(t.dataset.am));
window.onscroll=()=>{if(page!='read'||A.on)return;const r=$('#rd'),h=r.offsetHeight-innerHeight*.5;e.pos=Math.max(0,Math.min(1,-r.getBoundingClientRect().top/Math.max(h,1)));save();$('#wv')&&($('#wv').innerHTML=wv(id))};
document.onselectionchange=()=>{const t=String(getSelection()).trim(),sl=$('#sel');if(sl)sl.style.display=t&&getSelection().anchorNode&&$('#rd').contains(getSelection().anchorNode)?'':'none'};
$('#hl').onclick=()=>{(e.hl=e.hl||[]).push(e.ch+':'+String(getSelection()).trim());save();draw()};$('#sq').onclick=()=>{e.quotes.push(String(getSelection()).trim());save();$('#sel').style.display='none';$('#pl').textContent='Quote saved to your journal ✓'};
$('#sn').onclick=()=>{const n=prompt('Your note');if(n){e.notes.push(n);save()}};$('#rc').onclick=()=>recap('short');$('#br').oninput=x=>$('#stage').style.filter='brightness('+x.target.value/100+')';draw()}
function stopA(){A.on=false;try{speechSynthesis.cancel()}catch(e){}}
async function recap(kind){const id=S.cur,b=BK[id],e=S.lib[id],done=b.ch.slice(0,e.ch),box=$('#rcp');
if(!done.length){box.innerHTML='<div class="card">No chapter completed yet, so there is nothing to recap. Enjoy the start!</div>';return}
box.innerHTML='<div class="card mute">Writing your spoiler-free recap…</div>';
const t=await ai(`You are a spoiler-free reading companion. The reader has completed ONLY the chapters below. Write a ${kind=='short'?'short (3 sentence)':'detailed (2 paragraph)'} recap of what has happened so far. Use nothing beyond this text and never hint at what comes next.\n\n`+done.map((c,i)=>`Chapter ${i+1} – ${c[0]}\n${c[1]}`).join('\n\n'));
const txt=t||done.map((c,i)=>`Chapter ${i+1}, “${c[0]}”: ${sents(c[1]).slice(0,kind=='short'?1:2).join(' ')}`).join(' ');
box.innerHTML=`<div class="card"><div class="row"><h3>Where you left off</h3>${t?'':'<span class="tag">Demo mode</span>'}<span class="tag">🔒 Chapters 1–${done.length} only</span></div><p>${esc(txt)}</p><button class="g" id="r1">Short</button> <button class="g" id="r2">Detailed</button> <button id="rl">🔊 Listen to recap</button></div>`;
$('#r1').onclick=()=>recap('short');$('#r2').onclick=()=>recap('detailed');$('#rl').onclick=()=>{stopA();speechSynthesis.speak(new SpeechSynthesisUtterance(txt))}}
function music(){$('#m').innerHTML='<h1>Reading soundtracks</h1><p class="mute">Playlists open on Spotify. No music is hosted here. Authors and publishers will be able to suggest official playlists in a future version.</p><div class="grid">'+BOOKS.map(b=>`<div class="card row">${cov(b,1)}<div style="flex:1;min-width:140px"><span class="tag">${b.g}</span><h3>${b.pl[0]}</h3><p class="mute">${b.pl[2]}</p><a href="https://open.spotify.com/search/${encodeURIComponent(b.pl[1])}" target="_blank" rel="noopener"><button>Open in Spotify</button></a></div><div class="vin"><i></i></div></div>`).join('')+'</div>'}
let slp,CH=[];
function audio(){const ids=Object.keys(S.lib).filter(i=>S.lib[i]&&BK[i]);
if(!ids.length){$('#m').innerHTML='<h1>Audiobook</h1><div class="card">Add a book to start listening.<p>'+BOOKS.map(b=>`<button class="g" data-a="${b.id}">+ ${b.t}</button> `).join('')+'</p></div>';wire();return}
const id=ids.includes(S.cur)?S.cur:ids[0];S.cur=id;const b=BK[id],e=S.lib[id],P=[['#3b3f7a','#e57a9a','#f7c6a8'],['#134e5e','#e8873a','#f6d9b8']][BOOKS.indexOf(b)%2];if(e.shelf=='want')e.shelf='cur';
const ss=()=>sents(b.ch[e.ch][1]),T=()=>b.ch[e.ch][1].split(' ').length/2.6/A.rate,fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function ui(){$('#ap').textContent=A.on?'⏸':'▶';$('.scene').classList.toggle('pl',A.on)}
function tick(){$('#aw').innerHTML=wv(id);$('#t1').textContent=fmt(e.pos*T());$('#t2').textContent='-'+fmt((1-e.pos)*T());const s=ss();$('#cap').textContent=s[Math.min(s.length-1,Math.floor(e.pos*s.length))]}
function sp(){speechSynthesis.cancel();const s=ss();A.i=Math.min(s.length-1,Math.floor(e.pos*s.length));A.on=true;ui();(function nx(){if(!A.on)return;if(A.i>=s.length){if(e.ch<b.ch.length-1){e.ch++;e.pos=0;save();R();return sp()}A.on=false;e.shelf='fin';e.pos=1;e.done=today();save();ui();return}const u=new SpeechSynthesisUtterance(s[A.i]);u.rate=A.rate;u.onend=()=>{A.i++;e.pos=A.i/s.length;save();tick();nx()};speechSynthesis.speak(u)})()}
function jump(c){const w=A.on;stopA();e.ch=c;e.pos=0;save();R();if(w)sp()}
function skip(n){const s=ss();e.pos=Math.max(0,Math.min(.99,(Math.floor(e.pos*s.length)+n)/s.length));save();tick();if(A.on)sp()}
function R(){$('#m').innerHTML=`<div style="max-width:440px;margin:auto"><div class="row" style="justify-content:space-between;margin-bottom:10px"><select id="ab" style="width:auto">${ids.map(i=>`<option value="${i}" ${i==id?'selected':''}>${BK[i].t}</option>`).join('')}</select><span class="tag">🔄 Synced with reader</span></div>
<div class="scene"><div class="art"><svg viewBox="0 0 300 190" width="100%" style="display:block"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P[0]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient></defs><rect width="300" height="190" fill="url(#sk)"/><circle cx="225" cy="52" r="24" fill="${P[2]}"/><path d="M0 130 L70 62 L122 112 L182 54 L300 140 V190 H0Z" fill="${P[0]}" opacity=".75"/><path d="M0 160 L92 100 L160 144 L240 96 L300 155 V190 H0Z" fill="#241a2e" opacity=".85"/><rect x="44" y="138" width="26" height="20" fill="#ffd27a"/><path d="M40 138 L57 124 L74 138Z" fill="#c23b5a"/><rect y="168" width="300" height="22" fill="#fff" opacity=".12"/></svg></div>
<div style="padding:16px 20px;text-align:center"><div class="mute" style="letter-spacing:.25em;font-size:11px">AUDIOBOOK</div><h2>${b.t}</h2><div class="mute">${b.a} · Chapter ${e.ch+1}: ${b.ch[e.ch][0]}</div></div></div>
<div class="row s mute" style="justify-content:space-between;margin-top:16px"><span id="t1"></span><span id="t2"></span></div><div class="wave" id="aw"></div>
<div class="row" style="justify-content:center;margin:14px 0"><button class="g" id="b1">⟲</button><button class="g" id="pv">⏮</button><button id="ap" style="width:70px;height:70px;font-size:26px">▶</button><button class="g" id="nx">⏭</button><button class="g" id="f1">⟳</button></div>
<div class="row" style="justify-content:center">${[.75,1,1.25,1.5,2].map(x=>`<button class="${x==A.rate?'on':'g'}" data-x="${x}">${x}x</button>`).join('')}</div>
<div class="row" style="justify-content:center;margin:10px 0"><button class="g" data-am="rain">🌧</button><button class="g" data-am="fire">🔥</button><button class="g" data-am="">🔇</button><button class="g" id="sl">😴 Sleep 15m</button><button class="g" onclick="go('read')">📖 Read this</button><button class="g" onclick="go('music')">🎵</button></div>
<div class="card"><div class="mute" style="font-size:12px">NOW READING ALOUD</div><div id="cap" style="font-size:19px;font-style:italic;min-height:60px"></div></div>
<div class="card"><h3>Chapters</h3>${b.ch.map((c,i)=>`<div class="row" data-c="${i}" style="cursor:pointer;padding:6px 0"><span class="tag">${i+1}</span><span style="flex:1">${c[0]}</span><span class="mute">${i<e.ch?'✓ listened':i==e.ch?'now':''}</span></div>`).join('')}</div></div>`;
$('#ab').onchange=x=>{stopA();S.cur=x.target.value;save();audio()};$('#ap').onclick=()=>A.on?(stopA(),ui()):sp();$('#b1').onclick=()=>skip(-2);$('#f1').onclick=()=>skip(2);$('#pv').onclick=()=>e.ch>0&&jump(e.ch-1);$('#nx').onclick=()=>e.ch<b.ch.length-1&&jump(e.ch+1);
$$('[data-x]').forEach(x=>x.onclick=()=>{A.rate=+x.dataset.x;const w=A.on;R();if(w)sp()});$$('[data-c]').forEach(x=>x.onclick=()=>jump(+x.dataset.c));$$('[data-am]').forEach(t=>t.onclick=()=>ambience(t.dataset.am));
$('#sl').onclick=()=>{clearTimeout(slp);slp=setTimeout(()=>{stopA();try{ui()}catch(e){}},9e5);$('#sl').textContent='😴 Sleep timer on'};
$('#aw').onclick=x=>{const r=$('#aw').getBoundingClientRect();e.pos=Math.max(0,Math.min(.99,(x.clientX-r.left)/r.width));save();tick();if(A.on)sp()};ui();tick()}
R()}
function chat(){const ids=Object.keys(S.lib).filter(i=>S.lib[i]&&BK[i]);if(!ids.length){$('#m').innerHTML='<h1>Companion</h1><div class="card">Add a book first.</div>';return}
const id=ids.includes(S.cur)?S.cur:ids[0],b=BK[id],e=S.lib[id],done=b.ch.slice(0,e.ch);if(CH.id!=id)CH=Object.assign([],{id});
$('#m').innerHTML=`<h1>Reading companion</h1><p class="mute">Ask about <b>${b.t}</b>. 🔒 I only know ${done.length?'chapters 1–'+done.length:'what you finish (nothing yet)'}, so no spoilers.</p><div class="card" id="cb" style="min-height:240px;display:flex;flex-direction:column;gap:10px"></div><div class="row"><input id="ci" placeholder="Who is Mara again?" style="flex:1"><button id="cs">Send</button></div><div class="row" style="margin-top:10px">${['Who are the characters so far?','Remind me what happened','What mystery is unfolding?'].map(q=>`<button class="g qq">${q}</button>`).join('')}</div>`;
const r=()=>{$('#cb').innerHTML=CH.map(m=>`<div class="bub" style="align-self:${m.r=='u'?'flex-end':'flex-start'};background:${m.r=='u'?'var(--acc)':'var(--acc2)'};color:${m.r=='u'?'#fff':'var(--ink)'}">${esc(m.t)}</div>`).join('')||'<span class="mute">Say hello 👋</span>'};r();
async function send(q){if(!q)return;CH.push({r:'u',t:q});CH.push({r:'a',t:'…'});r();$('#ci').value='';let t=null;if(done.length)t=await ai(`You are a spoiler-free reading companion. The reader has finished ONLY these chapters; use nothing else and never hint at the future. Answer briefly.\n\n`+done.map((c,i)=>`Chapter ${i+1} – ${c[0]}\n${c[1]}`).join('\n\n')+`\n\nConversation: ${CH.slice(-7,-1).map(m=>m.t).join(' | ')}\nReader asks: ${q}`);
CH[CH.length-1].t=!done.length?'You haven’t finished a chapter yet, so I have nothing safe to share. Keep reading and I’ll be here!':t||'(Demo mode) So far: '+done.map(c=>sents(c[1])[0]).join(' ');r()}
$('#cs').onclick=()=>send($('#ci').value.trim());$('#ci').onkeydown=x=>x.key=='Enter'&&send($('#ci').value.trim());$$('.qq').forEach(x=>x.onclick=()=>send(x.textContent))}
go('home');
</script></body></html>
